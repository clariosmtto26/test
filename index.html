<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard BI</title>
  <style>
    /* Eliminar márgenes y ocultar scroll de la ventana exterior */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000; /* Puedes cambiar el color de fondo si lo deseas */
    }

    /* El iframe ocupa todo el tamaño de la pantalla */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Reemplaza el enlace de 'src' con la URL de inserción de tu dashboard -->
<iframe title="Rodillos" width="1140" height="541.25" src="https://app.powerbi.com/reportEmbed?reportId=a06ee6f8-0473-4b3a-a8a7-0e448aa0d609&autoAuth=true&ctid=74b72ba8-5684-402c-98da-e38799398d7d" frameborder="0" allowFullScreen="true"></iframe>

</body>
</html>
